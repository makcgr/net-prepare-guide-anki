artcat.FdaService.Tests.dll\" --TestCaseFilter:\"FullyQualifiedName~X\"` |\n| FDA module tests | Need `$(SolutionDir)` | Add `-p:SolutionDir=$(pwd)/` to restore, build and test |\n| Monolith in a git worktree | A scoped build does not copy MTP runner DLLs into the shared bin; `dotnet test <proj>` fails with `MTP0001` | Run the full `pwsh ./buildBackend.ps1` once, then run the DLL directly: `dotnet buildResult/app/bin/X.Tests.dll --filter \"FullyQualifiedName~Y\"` |\n| PTS integration | Needs a replica-set Mongo | `pwsh ./scripts/run-tests.ps1`, or set `SC_TESTS_MONGO_CONNSTR` |\n\n### 14.5 Run cadence\n\n1. While editing: a fast filtered run of one class.\n2. After a larger change: everything except integration (`-- --filter \"TestCategory!=Integration\"`).\n3. Before calling the task done: a full **unfiltered** run, including integration. A narrow filter can\n   hide tests you broke elsewhere.\n\nUse `--no-build` to re-run without rebuilding after a good build.\n\n---\n\n## 15. Reviewing tests: the checklist\n\nThe `review-tests-backend` skill is a pre-MR reviewer. Its job is not to check that tests pass (CI does\nthat) but to find **what is missing or weak**.\n\n| Rule | Severity | What it flags |\n|---|---|---|\n| T1 | BLOCKER | New handler/strategy (or new type branch) without a test |\n| T2 | MAJOR | Mongo schema change without an ephemeral/integration test |\n| T3 | MAJOR | New lock/semaphore without a contention test |\n| T4 | MINOR | Filter on `null` or `0` without tests for the other states (null / missing / zero) |\n| T5 | MINOR | Only call counts asserted, no behaviour |\n| T6 | MAJOR | Faking an interface introduced in the same MR |\n| T7 | NIT | Name does not describe behaviour (`Test1`) |\n| T8 | MINOR | `DateTime.UtcNow` / `Guid.NewGuid()` without injection; time asserted without a frozen clock |\n| T9 | MAJOR | New endpoint without an integration test |\n| T10 | NIT | Asserting on log messages |\n| T11 | MAJOR | Bug fix without a test that fails without the fix |\n| T12 | MAJOR | Permission chain without a \"higher scope disabled, lower active\" test |\n| T13 | MAJOR | Legacy-fallback read path not tested against unmigrated documents |\n| T14 | MAJOR | State-update fix without a replay (same input twice) test |\n| T15 | MINOR | New index without warm-up and migration tests |\n| T16 | MAJOR | Chat message pipeline without a `System`-role injection test |\n| T17 | MAJOR | New retry loop without a \"gives up after N\" test |\n| T18 | MAJOR | New hash used across pods without a cross-process test |\n\nThe skill also says: check the repo for a past-incidents file (for example\n`.claude-review/past-incidents.md`) and treat its entries as repo-specific rules. That is how a\ncodebase carries its own bug history into reviews.\n\nOutput format, one line per finding:\n\n```\n[MAJOR] src/Module/Services/ScopeService.cs \u2014 fix to scope status update has no replay test. Rule T14.\n```\n\n---\n\n## At Smartcat (summary)\n\n- **Framework:** NUnit + FakeItEasy in the monolith, PTS, WOS, FDA and Scol. Some newer AI services use\n  xUnit.\n- **Base classes:** `BaseTest` (DI + fakes), `BaseEphemeralMongoTest`, `BaseMongoTest`,\n  `BaseKafkaTest`, `BaseElasticsearchTest`; PTS adds `BaseDockerMongoFixtureTest` and\n  `BaseComponentTest`.\n- **Naming:** `Should_<behaviour>[_when_<condition>]`.\n- **Structure:** bare `// Arrange`, `// Act`, `// Assert`; one Act; preconditions with `Assume.That`.\n- **Asserts:** constraint model only; classic asserts fail the PTS build.\n- **Discipline:** characterization first, red \u2192 green \u2192 refactor, mock only at seams, inject clock and\n  ID providers.\n- **Running:** target the `.sln`, use `-- --filter`, verify the count; FDA uses `dotnet vstest`.\n- **Review:** T1\u2013T18 from `review-tests-backend`, plus the \"no reflection into non-public members\" rule.\n- **Real examples to read:**\n  - `project-tasks-service/src/Tests/Services/ProjectTaskStateCalculatorTests.cs` (TestCaseSource)\n  - `project-tasks-service/src/Tests/Managers/ProjectTaskDeadlineManagerTests.cs` (BaseTest + FakeItEasy)\n  - `project-tasks-service/src/Tests/Integration/SplitScopeCompletionTests.cs` (component test)\n  - `smartcat/Features/Cat/AbbyyLS.SmartCAT.BL.Tests/Projects/ProjectCompletionLockServiceTests.cs`\n    (FakeTimeProvider + real Mongo)\n\n---\n\n## Interview corner\n\n### As the interviewee\n\n1. **What is the difference between a unit test and an integration test? Where do you draw the line?**\n   A strong answer covers:\n   - Unit: one class, external seams replaced, milliseconds, many of them.\n   - Integration: real wiring (DI, HTTP pipeline, database) for a slice of the system.\n   - The line is \"what can break here\": query logic needs a real DB, business rules do not.\n   - Mentions cost of failure diagnosis, not only run time.\n\n2. **What do you mock and what do you keep real?**\n   - Mock seams: other services, time, randomness, I/O at the boundary.\n   - Keep real: the class under test, value objects, cheap collaborators, the database in repository tests.\n   - Danger of faking an interface designed in the same change (the fake copies your assumptions).\n\n3. **How does NUnit's fixture lifecycle differ from xUnit's, and why does it matter?**\n   - NUnit: one fixture instance for all tests (default); xUnit: a new instance per test.\n   - Fields leak between NUnit tests unless reset in `[SetUp]`.\n   - `FixtureLifeCycle(InstancePerTestCase)` exists; parallel `ParallelScope.All` needs care.\n\n4. **When do you use `TestCaseSource` instead of `TestCase`?**\n   - `TestCase` takes only constants; `TestCaseSource` takes objects, collections, records.\n   - Source must be static; `TestCaseData.SetName` for readable names.\n   - Avoid huge tables that hide which rule a row checks.\n\n5. **What does an unconfigured FakeItEasy fake return?**\n   - Dummy values: default for value types, `\"\"` for strings, completed tasks, fakes for interfaces.\n   - Not `null` for interfaces, so \"not found\" must be configured explicitly.\n   - Strict fakes exist but make tests brittle.\n\n6. **What is wrong with asserting only `MustHaveHappenedOnceExactly`?**\n   - It pins how, not what; refactoring breaks it.\n   - Assert the resulting state; use call verification when the call is the behaviour (publish an event,\n     do not call an API).\n\n7. **How do you test code that depends on the current time?**\n   - Inject `TimeProvider` (or a clock interface); use `FakeTimeProvider` and `Advance`.\n   - Timers and `Task.Delay`/`WaitAsync` overloads that take a `TimeProvider` are driven by `Advance`.\n   - No `Thread.Sleep`, no \"within one minute\" asserts.\n\n8. **How do you test that a lock really prevents concurrent execution?**\n   - Deliberate contention: many concurrent calls with `Task.WhenAll`.\n   - A gate (`TaskCompletionSource`) to hold the first caller inside the section.\n   - Measure maximum concurrency with `Interlocked`; avoid sleeps.\n   - For distributed locks: two instances against one real database.\n\n9. **You need to change a 600-line legacy method without tests. How do you start?**\n   - Characterization tests to pin current behaviour first.\n   - Find or create a seam (extract a dependency, inject time).\n   - Small refactor steps under green tests; then the behaviour change with a new failing test.\n\n10. **How do you test an ASP.NET Core endpoint end to end inside the test process?**\n    - `WebApplicationFactory<Program>` / `TestServer`, `ConfigureTestServices` to replace external\n      clients.\n    - Host per fixture, unique data per test.\n    - Assert status codes and the response contract; real DB where cheap.\n\n11. **A test needs a private field value. What do you do?**\n    - Do not use reflection; assert via public behaviour.\n    - If that is not possible, extract the hidden piece into an injectable type.\n    - Last resort: `internal` + `InternalsVisibleTo`.\n    - Structure-only architecture tests with reflection are fine.\n\n12. **Your `dotnet test --filter X` ran all 3,000 tests. Why?**\n    - MTP runner bridge: the top-level filter is ignored silently; use `-- --filter`.\n    - Always check the executed count.\n    - Mentions `TestCategory=` for NUnit categories.\n\n13. **How do you test idempotency of a Kafka handler?**\n    - Process the same message (same ID) twice, assert one side effect.\n    - At-least-once delivery makes duplicates normal; see chapter 07.\n\n14. **What does TDD give you, and when do you skip it?**\n    - Catches misread requirements early; every test has been seen failing.\n    - RED must fail for the right reason.\n    - Skip for config, renames, docs, version bumps, and say so.\n\n### As the interviewer\n\n**What to ask:** give the candidate a small service with a repository, a clock and an external API\nclient, and ask: \"Write the tests for this. Which ones first? What do you fake?\"\n\n**Depth probes:**\n- \"Your fake returns the entity for any ID. What branch is now not tested?\"\n- \"This test passes alone and fails in the full run. What do you check first?\" (shared state, order,\n  parallel fixtures, static caches.)\n- \"How would you make this `retry after 30 seconds` test run in 10 ms?\"\n- \"Show me how this test fails if I revert the fix.\"\n- \"Why does this Mongo test need old-shape documents?\"\n- \"What would make you choose an integration test over ten unit tests here?\"\n\n**Green flags:**\n- Chooses the test level from the risk, not from habit.\n- Configures the negative paths explicitly (null, throws, cancelled token).\n- Talks about determinism: injected time, gates instead of sleeps.\n- Asserts behaviour and state; uses call verification only where the call is the contract.\n- Checks that a regression test fails without the fix.\n\n**Red flags:**\n- \"100% coverage\" as the goal; tests without meaningful assertions.\n- Mocks the class under test or the Mongo driver.\n- `Thread.Sleep` in tests; `DateTime.Now` in product code with \"the test is flaky sometimes\".\n- Uses reflection to read private fields as a normal practice.\n- Cannot explain why a test is red in CI but green locally.\n\n**Scoring rubric:**\n\n| Signal | Junior | Senior | Staff |\n|---|---|---|---|\n| Test level choice | Unit tests for everything | Picks unit vs integration per risk | Designs the seams so each risk has a cheap test level |\n| Fakes | Fakes everything, or nothing | Fakes at seams, keeps value objects real | Spots tests that copy assumptions (same-MR fakes), pushes for contract tests |\n| Determinism | Sleeps and retries | Fake clock, TCS gates | Builds time/ID abstractions into the platform; removes flaky classes of tests |\n| Legacy code | Rewrites first | Characterization tests first | Plans incremental seams and a test strategy for a whole module |\n| Tooling | Runs tests in the IDE only | Knows filters, categories, CI cadence | Diagnoses runner, props and CI infra failures quickly |\n\n---\n\n## Exercises\n\n1. **Find the bugs in this test.**\n\n   ```csharp\n   private readonly List<Order> _orders = new();\n\n   [Test]\n   public async Task Test_Process()\n   {\n       A.CallTo(() => _repo.Get(A<Guid>._)).Returns(new Order());\n       var svc = Get<OrderService>();\n       _orders.Add(await svc.Process(Guid.NewGuid()));\n       Thread.Sleep(1000);\n       Assert.AreEqual(1, _orders.Count);\n       A.CallTo(() => _repo.Save(A<Order>._)).MustHaveHappenedOnceExactly();\n   }\n   ```\n\n2. **Make it deterministic.** `CacheEntry.IsExpired` uses `DateTime.UtcNow`. Change the design and write\n   a test for \"expires exactly after 10 minutes\".\n\n3. **Characterize a legacy method.** You are given `string FormatInvoiceNumber(int year, int seq,\n   bool proForma)` with no tests. Describe the characterization tests you write before you change the\n   `proForma` formatting.\n\n4. **Contention test.** Write a test showing that `ImportService.RunAsync` never runs two imports for the\n   same project at the same time, without `Task.Delay`.\n\n5. **Reflection fix.** A test reads `_allowedExtensions` with `GetField(..., BindingFlags.NonPublic)`.\n   The test project already has `InternalsVisibleTo`. What severity do you give in review, and what fix\n   do you propose first?\n\n6. **Filter debugging.** `dotnet test src/Tests/Tests.csproj --filter \"Category=Unit\"` fails with\n   `MSB4019`. After you fix that, it runs all tests. List every problem in the command.\n\n<details>\n<summary>Answer notes<\/summary>\n\n1. Name `Test_Process` describes nothing (use `Should_save_order_when_processing_succeeds`). No AAA\n   markers. `_orders` is a field initialized once: NUnit shares the fixture instance, so the list\n   grows across tests. `Thread.Sleep` is useless and slow (the call was already awaited). Classic\n   `Assert.AreEqual` fails the PTS build; use `Assert.That(..., Has.Count.EqualTo(1))`. The only real\n   check is a call count; assert the order state (for example `Status == Processed`). The fake returns\n   an order for any ID, so the \"not found\" branch is untested (add a separate test).\n\n2. Inject `TimeProvider` into `CacheEntry` (or its factory). Test: `FakeTimeProvider` with a fixed\n   start; create the entry; `Advance(TimeSpan.FromMinutes(10) - TimeSpan.FromTicks(1))` \u2192 not expired;\n   `Advance(TimeSpan.FromTicks(1))` \u2192 expired. Two tests, one behaviour each, boundary on both sides.\n\n3. Use `TestCase` rows that cover: normal year/seq, `seq` with padding boundaries (1, 9, 10, 999, 1000),\n   `proForma` true and false, year boundaries. Start each with a wrong expected value, read the real\n   value from the failure, paste it in. Commit the green tests first, then change the `proForma` branch\n   with a new failing test for the new format, and update only the `proForma` rows on purpose.\n\n4. Fake the importer with `ReturnsLazily` that increments a counter with `Interlocked`, records the\n   maximum, and awaits a `TaskCompletionSource` gate. Start 10 calls for the same project ID, yield,\n   release the gate, `await Task.WhenAll`, assert max is 1. Add a second test with different project\n   IDs that asserts max is greater than 1 if the design allows parallel imports across projects.\n\n5. MAJOR, because `InternalsVisibleTo` already exists (the fallback was a one-word change). But the\n   first fix is still option 1: assert through the public API (`IsAllowed(\"x.pptx\")` true,\n   `IsAllowed(\"x.exe\")` false). If the list must be visible, extract it into an injectable type.\n\n6. Targeting the `.csproj` leaves `$(SolutionDir)` empty \u2192 `MSB4019`; target the `.sln` or pass\n   `-p:SolutionDir=<root>/`. The top-level `--filter` is ignored under the MTP bridge \u2192 use\n   `-- --filter`. `Category=Unit` is the wrong property; NUnit categories use `TestCategory=Unit`. And\n   check the executed test count to confirm the filter worked.\n\n<\/details>\n\n---\n\n## Summary\n\n- Choose the test level by \"what can break\": logic \u2192 unit, queries \u2192 real Mongo, endpoints \u2192 in-process host.\n- NUnit shares one fixture instance across tests by default; reset state in `[SetUp]`.\n- Constraint model only (`Assert.That`); classic asserts fail the PTS build.\n- FakeItEasy fakes are loose and return dummies, not `null`; configure negative paths explicitly.\n- Assert behaviour and state; call verification only when the call is the contract.\n- Mock only at seams; never the class under test, value objects, or interfaces from the same MR.\n- Inject `TimeProvider` and ID providers; use `FakeTimeProvider.Advance` instead of sleeping.\n- Make concurrency deterministic with gates (`TaskCompletionSource`) and `Task.WhenAll`.\n- Characterization tests before changing legacy code; a regression test must fail without the fix.\n- No reflection into non-public members: public API first, extract a dependency second,\n  `InternalsVisibleTo` last.\n- Run tests via the `.sln`, use `-- --filter`, verify the executed count; FDA needs `dotnet vstest`.\n\nAnki deck: anki/10-testing.txt\n"}, {"id": "11-diff-coverage", "title": "11. Diff coverage: testing what you changed", "md": "# 11. Diff coverage: testing what you changed\n\n## Why this chapter matters\n\nCoverage questions look simple in interviews (\"what coverage do you aim for?\"), but they test\njudgment: does the candidate know what a coverage number can and cannot say, and can they use it\nwithout turning it into a game? In real work at Smartcat, diff coverage is a **blocking merge gate**\non the monolith: an MR whose new or changed lines are less than 80% covered does not merge. Knowing how\nthe gate computes its number, how to read its report and how to fix it quickly saves hours on every\nsecond MR.\n\n## What you will be able to do\n\n- Explain line, branch and diff coverage, and why a team gates on diff coverage instead of total coverage.\n- Read the Smartcat Diff Coverage report and turn it into a short list of tests to write.\n- Produce and read Cobertura coverage locally with coverlet or Microsoft code coverage.\n- Avoid the `dotnet test` filter trap and the most common CI coverage failures.\n- Explain why coverage is not quality and how mutation testing fills the gap.\n- Talk about metrics in an interview without falling into Goodhart's law.\n\n---\n\n## 1. Line, branch and diff coverage\n\n**Line coverage**: the share of executable lines that ran at least once during the tests.\n**Branch coverage**: the share of decision outcomes (each side of an `if`, each `case`, each `&&`\nshort-circuit) that ran at least once. **Diff coverage**: line (or branch) coverage measured **only on\nthe lines changed by your MR**.\n\n```csharp\npublic decimal Discount(Customer customer, decimal total)\n{\n    if (customer.IsVip && total > 1000) return total * 0.1m;   // line A\n    return 0;                                                  // line B\n}\n```\n\nOne test with a VIP customer and `total = 2000`:\n\n| Metric | Value | Why |\n|---|---|---|\n| Line coverage | 50% (A ran, B did not) | Only the `return total * 0.1m` path executed |\n| Branch coverage | Low | `IsVip == false`, `total <= 1000` were never taken |\n\nAdd a second test with a non-VIP customer: line coverage becomes 100%. But the `total <= 1000` outcome\nfor a VIP is still never taken. **Branch coverage still shows the gap; line coverage does not.** This is\nwhy \"100% line coverage\" can hide untested logic, especially on one-line conditions.\n\nWhat counts as an \"executable line\": statements the compiler emits sequence points for. Braces,\ncomments, `using` directives, blank lines, and most auto-property declarations are usually not counted.\nExact rules depend on the tool.\n\n| Kind | Question it answers | Weakness |\n|---|---|---|\n| Line | Did this line run? | Blind to untaken branches on the same line |\n| Branch | Did each decision outcome run? | Noisy in async/iterator code (compiler-generated branches) |\n| Method | Was this method called at all? | Very coarse |\n| Diff | Did the lines I changed run? | Says nothing about old code or about assertion quality |\n\n**Common mistake:** \"the line is green, so the logic is tested\". Green means *executed*. It does not\nmean any assert checked the result.\n\n---\n\n## 2. Why gate on diff coverage\n\nA large legacy system (the Smartcat monolith is many years old) will never reach a high **total**\ncoverage number. A total-coverage gate then has two bad outcomes:\n\n- The threshold is low (say 35%), so it blocks nothing.\n- The threshold is high, so every MR is blocked by code its author never touched.\n\nTotal coverage also moves for the wrong reasons: deleting a well-tested class **lowers** it; adding an\nuntested DTO in a huge codebase barely changes it.\n\n**Diff coverage** asks a fair, local question: *did you test the code you wrote or changed?*\n\n- **New code must be tested.** The gate applies to every changed executable line.\n- **Legacy is not blocking.** Untested old code next to your change does not count against you.\n- **It works like a ratchet.** Every MR adds tested code; over time the tested share grows in exactly\n  the places that change most, which are also the places where bugs appear.\n\n```mermaid\nflowchart LR\n    MR[\"MR pipeline\"] --> T[\"Run tests<br/>with coverage\"]\n    T --> C[\"Cobertura report<br/>(per line hits)\"]\n    MR --> D[\"git diff vs merge-base<br/>with origin/develop\"]\n    C --> X[\"Intersect: changed<br/>executable lines\"]\n    D --> X\n    X --> R{\"LineRate >= 0.8?\"}\n    R -- yes --> OK[\"Gate passes\"]\n    R -- no --> FAIL[\"Gate fails<br/>report lists uncovered lines\"]\n```\n\n**Tradeoff:** diff coverage punishes small MRs more. A 5-line change with 1 untested line is at 80%;\nwith 2 untested lines it fails. In practice this is a feature: small changes are the easiest to test.\n\n**Tip:** if a refactoring moves 300 old untested lines, they become \"changed\" lines and enter the gate.\nSplit mechanical moves from behaviour changes, or add characterization tests first (see chapter 10,\nsection 12).\n\n---\n\n## 3. How coverage is collected in .NET\n\n### 3.1 Tools\n\n| Tool | How you enable it | Output |\n|---|---|---|\n| coverlet.collector (VSTest data collector) | `dotnet test --collect:\"XPlat Code Coverage\"` | `TestResults/<guid>/coverage.cobertura.xml` |\n| coverlet.msbuild | `dotnet test /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura` | `coverage.cobertura.xml` |\n| Microsoft.Testing.Extensions.CodeCoverage (MTP runner) | `dotnet test ... --coverage --coverage-output-format cobertura --coverage-output out.xml` | Cobertura or binary `.coverage` |\n| ReportGenerator | `reportgenerator -reports:**/coverage.cobertura.xml -targetdir:coverage-html` | HTML report for humans |\n\nThe tools instrument (or profile) the compiled assemblies, run the tests, and record hits per\nsequence point. Coverlet rewrites IL; Microsoft code coverage uses a profiler.\n\n**At Smartcat:** test projects use the MTP NUnit runner (see chapter 10, section 14), so the MTP\ncoverage extension is the natural local choice. The `qa-mutation-analysis` skill collects a C# baseline\nthis way:\n\n```bash\nSC_TESTS_CI_MODE=true dotnet build path/to/Tests.csproj -c Debug\nSC_TESTS_CI_MODE=true dotnet test path/to/Tests.csproj --no-build \\\n  --coverage --coverage-output-format cobertura --coverage-output .test-coverage/baseline.xml\n```\n\n### 3.2 Reading Cobertura XML\n\n```xml\n<coverage line-rate=\"0.62\" branch-rate=\"0.48\" lines-covered=\"310\" lines-valid=\"500\">\n  <packages>\n    <package name=\"Smartcat.ProjectTasksService.Module\" line-rate=\"0.62\" branch-rate=\"0.48\">\n      <classes>\n        <class name=\"ScopeService\" filename=\"src/ProjectTasks.Module/Services/ScopeService.cs\"\n               line-rate=\"0.75\" branch-rate=\"0.5\">\n          <lines>\n            <line number=\"41\" hits=\"12\" branch=\"false\" />\n            <line number=\"42\" hits=\"3\" branch=\"true\" condition-coverage=\"50% (1/2)\" />\n            <line number=\"43\" hits=\"0\" branch=\"false\" />\n          <\/lines>\n        <\/class>\n      <\/classes>\n    <\/package>\n  <\/packages>\n<\/coverage>\n```\n\n- `hits=\"0\"` is an uncovered line.\n- `condition-coverage=\"50% (1/2)\"` is a line that ran but only one branch outcome was taken.\n- `line-rate` and `branch-rate` are 0..1 fractions.\n\n**Tip:** when a coverage gate surprises you, open the Cobertura file for that one class and look at\nthe exact line numbers. It is faster than guessing from the IDE colours.\n\n### 3.3 GitLab integration (general)\n\nGitLab can show coverage in the MR diff gutter if a job publishes a Cobertura report:\n\n```yaml\ntest:\n  script: dotnet test ... --collect:\"XPlat Code Coverage\"\n  artifacts:\n    reports:\n      coverage_report:\n        coverage_format: cobertura\n        path: \"**/coverage.cobertura.xml\"\n```\n\nThis shows **which lines** are covered while you review. It is not a gate by itself. The gate is a\nseparate job that compares a number with a threshold.\n\n---\n\n## 4. How a diff coverage number is computed\n\n1. **Find the base.** Compute the merge-base of the MR source commit and the target branch\n   (`origin/develop`). Comparing with the merge-base, not the current tip of develop, means other\n   people's new commits on develop do not enter your diff.\n2. **Collect changed lines.** From `git diff merge-base..source`, take the added or modified lines per\n   file (deleted lines cannot be covered and do not count).\n3. **Intersect with executable lines.** Keep only changed lines that the coverage report knows as\n   executable. A changed comment or brace is not counted.\n4. **Count.** `LineRate = covered changed lines / total changed executable lines`.\n5. **Compare** with the threshold and list uncovered lines per file.\n\nConsequences you should be able to explain:\n- Files outside any test-covered assembly (no tests load them) show 0 hits for all lines.\n- A changed line inside a method that no test calls is uncovered even if its file has 90% total\n  coverage.\n- Moving a block of code makes every moved line \"changed\".\n\n---\n\n## 5. At Smartcat: the diff coverage gate\n\n**At Smartcat (monolith):**\n- The blocking job is `Backend/Code Coverage [Diff Line Rate Check]`, stage `TestCoverageAnalysis`,\n  run by an internal tool (`smartcat-diff-coverage`). It is **not** allowed to fail.\n- Threshold: **`LineRate >= 0.8`** on the changed lines.\n- The diff base is the merge-base with `origin/develop`.\n- The result is posted on the MR as a **Diff Coverage Status** comment with a JSON body.\n\n### 5.1 Reading the report\n\n```json\n{\n  \"CoveredLines\": 8,\n  \"TotalLines\": 16,\n  \"LineRate\": 0.5,\n  \"UncoveredFiles\": [\n    {\n      \"FileName\": \"Features/Module/SettingsModel.cs\",\n      \"CoveredLines\": 0,\n      \"TotalLines\": 1,\n      \"LineRate\": 0,\n      \"UncoveredLines\": \"39\"\n    }\n  ]\n}\n```\n\n| Field | Meaning |\n|---|---|\n| `CoveredLines` / `TotalLines` | Changed executable lines that ran / all changed executable lines in the MR |\n| `LineRate` | Their ratio; the gate needs `>= 0.8` |\n| `UncoveredFiles[]` | Only files that have at least one uncovered changed line |\n| `UncoveredLines` | The line numbers (in the MR's version of the file) to look at |\n\nHow to read it in practice:\n- First, check `LineRate`. If it is `>= 0.8`, stop: nothing to do.\n- Then sort `UncoveredFiles` by `TotalLines - CoveredLines`. The biggest gaps first.\n- A file with `TotalLines: 1` and an uncovered line in a model is often a trivial property. A file with\n  20 uncovered lines in a service is your real work.\n- How far below the threshold you are tells you how many lines you need: with 8/16, you need at least\n  13/16, so at least 5 more lines covered.\n\n### 5.2 The workflow to fix a failing report\n\nFrom the `backend-smartcat-backend-code-coverage` skill:\n\n1. **Get the changes.** From the MR URL, take project and MR IID; fetch the MR metadata and the\n   changed files and diffs. Without an MR and its CI report there is nothing to analyze.\n2. **Analyze the report.** Find the Diff Coverage Status comment. If there is none, the pipeline has\n   not run yet or the job is still pending.\n3. **Map lines to code.** Read each uncovered file at the listed lines. Check if tests already exist\n   for that class (`*Tests.cs`). Decide which lines are testable logic and which are trivial.\n4. **Write tests** following chapter 10 (BaseTest, FakeItEasy, AAA, `Should_..._when_...`), then run\n   them and confirm they pass.\n5. **Push and re-check** the new report.\n\n### 5.3 Prioritization\n\nNot all uncovered lines are equal. Write tests in this order:\n\n1. **Business logic**: conditionals, calculations, state transitions.\n2. **Error handling**: catch blocks, validation, guard clauses.\n3. **Integration points**: API calls, message handlers, repository methods.\n\nDeprioritize:\n- DTOs and POCOs with only auto-properties.\n- One-line pass-through methods (`return _inner.DoSomething();`).\n- Generated code and configuration models.\n\n**Why this order:** the gate counts lines equally, but bugs do not. One test of a state transition\nusually covers several lines **and** protects real behaviour. A constructor test for a DTO covers a\nline and protects nothing.\n\n### 5.4 A worked example\n\nThe report says `Features/Cat/Projects/ProjectArchiver.cs`, `UncoveredLines: \"58,61\"`. The code:\n\n```csharp\n55  public async Task ArchiveAsync(Guid projectId, CancellationToken ct)\n56  {\n57      var project = await _repository.GetById(projectId, ct)\n58          ?? throw new ProjectNotFoundException(projectId);\n59\n60      if (project.Status == ProjectStatus.Archived)\n61          return;\n62\n63      project.Archive(_time.GetUtcNow());\n64      await _repository.Save(project, ct);\n65  }\n```\n\nLines 63\u201364 are covered, so a happy-path test exists. Line 57 also ran (the repository call). The gaps are the \"not found\" path (58: the\n`throw` part of the expression was never reached) and the \"already archived\" early return (61). Two\ntests:\n\n```csharp\n[Test]\npublic void Should_throw_not_found_when_project_does_not_exist()\n{\n    // Arrange\n    A.CallTo(() => _repository.GetById(A<Guid>._, A<CancellationToken>._)).Returns((Project?)null);\n    var archiver = Get<ProjectArchiver>();\n\n    // Act\n    Func<Task> act = () => archiver.ArchiveAsync(Guid.NewGuid(), CancellationToken.None);\n\n    // Assert\n    Assert.ThrowsAsync<ProjectNotFoundException>(act);\n}\n\n[Test]\npublic async Task Should_not_save_when_project_is_already_archived()\n{\n    // Arrange\n    var project = ProjectBuilder.Archived();\n    A.CallTo(() => _repository.GetById(project.Id, A<CancellationToken>._)).Returns(project);\n    var archiver = Get<ProjectArchiver>();\n\n    // Act\n    await archiver.ArchiveAsync(project.Id, CancellationToken.None);\n\n    // Assert\n    A.CallTo(() => _repository.Save(A<Project>._, A<CancellationToken>._)).MustNotHaveHappened();\n}\n```\n\nBoth tests protect real behaviour (no silent save of an archived project, a clear error for a missing\none). They were not written \"for coverage\"; the report only showed where they were missing.\n\n---\n\n## 6. The `dotnet test` filter trap\n\nAfter writing the tests, you run only them. The trap: when the repo uses the NUnit MTP runner\n(`EnableNUnitRunner=true`), a top-level `--filter` is consumed by `dotnet test` and silently ignored.\n\n```bash\n# CORRECT: the filter goes after -- so it reaches the NUnit runner\ndotnet test <path/to/Tests.csproj> -- --filter \"MyTestClass\"\n\n# WRONG: may run all tests; the filter is consumed by dotnet/VSTest instead of NUnit\ndotnet test <path/to/Tests.csproj> --filter \"MyTestClass\"\n```\n\nWithout the MTP runner (classic VSTest), the top-level form is correct:\n\n```bash\ndotnet test <path/to/Tests.csproj> --filter \"MyTestClass\"\n```\n\nTwo more details from chapter 10 (section 14):\n- In Smartcat repos, targeting a bare `.csproj` can fail with `MSB4019` because `$(SolutionDir)` is\n  empty. Prefer the `.sln`, or pass `-p:SolutionDir=<repo-root>/`.\n- **Check the executed count.** If it equals the whole suite, the filter was ignored.\n\n**Note on sources:** the coverage skill shows a `.csproj` path in its example, while the test-execution\nskill says to target the `.sln`. Both agree on the important part: `-- --filter` under MTP. Use the\n`.sln` form when the csproj form fails with `MSB4019`.\n\n---\n\n## 7. Troubleshooting\n\n| Problem | Likely cause | Fix |\n|---|---|---|\n| MR has no Diff Coverage comment | CI pipeline has not run yet, or the job is pending | Wait for CI, or run coverage locally |\n| `LineRate` is 0 but all code is trivial | DTOs or models counted as uncovered | `[ExcludeFromCodeCoverage]` on pure data types, or a minimal test that uses them |\n| Tests pass but coverage does not improve | Tests do not reach the exact uncovered lines | Re-check `UncoveredLines`; drive the exact branch (the `throw`, the early return) |\n| Can't find the test project | Non-standard repo layout | Ask the owner, or search for `*Tests.csproj` referencing the assembly |\n| Tests ran, but the report shows 0 for a whole file | No test project loads that assembly, or the test failed before reaching it | Check project references and that the tests really executed (count) |\n| Gate crashes with `FindMergeBase ... object not found` | CI shallow clone (see section 8) | Retry the job |\n\n**About `[ExcludeFromCodeCoverage]`:** it is a legitimate tool for generated code and pure data\nholders. It is **not** a tool for hiding logic you did not want to test. A reviewer who sees it on a\nclass with `if` statements will ask why. Use it rarely and explain it in the MR.\n\n---\n\n## 8. CI flakes around the gate\n\n### 8.1 Shallow-clone merge-base: \"object not found\"\n\n**At Smartcat (observed on monolith MRs):** the diff coverage job sometimes fails **before measuring\nanything**:\n\n```\nLibGit2Sharp.LibGit2SharpException: object not found - no match for id (<sha>)\n   at ObjectDatabase.FindMergeBase(...)\n```\n\nWhat it means: the tool calls `FindMergeBase(origin/develop, source)`. CI checks out a **shallow\nclone** (limited history). If the walk needs a commit that is not in the shallow history, LibGit2Sharp\ncannot find it.\n\nWhy it is environmental, not your code:\n- It happens even when the branch is 0 commits behind develop.\n- The \"missing\" commit ID changes from run to run, and it exists in a full local clone.\n\nWhat to do:\n1. **Retry the failed job.** A retry can land on a runner whose clone has the needed history.\n2. If the retry fails with the **same** missing ID, stop retrying that job and **start a fresh MR\n   pipeline**.\n3. **Do not** keep merging or rebasing develop \"to refresh the merge-base\". The pipeline takes a long\n   time, develop moves on, and the error also happens at zero divergence. You lose the race.\n4. If it keeps failing: ask DevOps to increase the fetch depth for that job, or let a human decide to\n   waive that one gate. The clone depth is set in a shared CI template, not in the repo.\n\n### 8.2 Other flakes\n\nA coverage job usually needs the test job to pass first. A flaky unrelated test (for example a timing\ntest, or an email template test that fails once in a few thousand runs) blocks the gate too. Treat it\nthe usual way: confirm the failure is unrelated to your diff (different area, passes on retry, known\nflaky), retry, and report it if it repeats.\n\n**Tip:** read the job log before changing code. \"The gate failed\" can mean \"your lines are\nuncovered\", \"the tool crashed\", or \"an earlier job failed\". Only the first one needs tests.\n\n---\n\n## 9. Coverage is not quality\n\nCoverage measures **execution**, not **verification**. This test gives 100% line coverage of\n`Discount` and checks nothing:\n\n```csharp\n[Test]\npublic void Should_calculate_discount()\n{\n    _calculator.Discount(vip, 2000);\n    _calculator.Discount(regular, 10);\n}\n```\n\nWays tests reach coverage without quality:\n- **Assertion-free tests**: the code runs, nothing is checked.\n- **Weak assertions**: `Assert.That(result, Is.Not.Null)` on a calculated value.\n- **Only call-count assertions** (rule T5 in chapter 10).\n- **Asserting what the fake returns**: the test checks the setup, not the code.\n\n### 9.1 Mutation testing\n\nMutation testing answers: *if I break the code, does a test fail?* A tool (Stryker.NET for C#,\nStrykerJS for TypeScript) makes many small changes to the code, called **mutants**: `>` becomes `>=`,\n`&&` becomes `||`, a `return x` becomes `return default`, a statement is removed. Then it runs the\ntests for each mutant.\n\n- **Killed**: a test failed. Good.\n- **Survived**: all tests still passed. The tests do not verify that behaviour.\n- **NoCoverage**: no test even runs that code.\n- Timeout, CompileError, Ignored: excluded from the score.\n\n```\nmutation score = killed / (killed + survived + no_coverage) \u00d7 100\n```\n\nFor `Discount`, the mutant `total > 1000` \u2192 `total >= 1000` survives unless a test uses exactly\n`total = 1000`. That is a real missing boundary test, which no coverage number shows.\n\n**At Smartcat:** the QA skills (`qa-mutation-analysis`, `qa-cpa-mutation-score`) use this rule for\n**coverage theater**:\n\n```\nline coverage >= 80%  AND  mutation score < 60%   \u2192   theater flag\n```\n\nHigh coverage with a low mutation score means the tests run the code but do not check it.\n\nPractical rules from those skills:\n- **Never run Stryker on the whole repo.** It is slow (every mutant reruns tests). Run it per file with\n  `--mutate` on a sample.\n- Sample across coverage buckets: some high-coverage files (to detect theater), some medium (most\n  actionable), a few low (to see the floor).\n- A practical target in those skills is around 70% mutation score, not 100%. Some mutants are\n  equivalent (they do not change behaviour) and can never be killed.\n\n### 9.2 Risk-weighted coverage\n\nThe critical-path analysis skills (`qa-cpa-coverage-analysis`) do not ask \"what is the coverage\npercentage?\". They classify components by impact (for example *Fatal* or *Corrupt* when a failure\nloses or corrupts customer data) and only then check if the **key code paths and branches** of those\ncomponents are tested: **RED** (no tests), **YELLOW** (some paths), **GREEN** (all public methods and key\nbranches). They also cross-reference bug tickets with untested paths. This is the mature view:\ncoverage is a tool to find **untested risk**, not a score.\n\n---\n\n## 10. Designing code so it is coverable\n\nHard-to-cover lines are usually a design signal. If a line can only run when the real clock passes\nmidnight, or when a real HTTP call times out, no unit test can reach it cheaply. The fix is a **seam**:\na place where the test can control the behaviour.\n\n```csharp\n// HARD TO COVER: hidden time, hidden HTTP, catch block unreachable in tests\npublic class ReportSender\n{\n    public async Task SendAsync(Report report)\n    {\n        if (DateTime.UtcNow.Hour < 6) return;                 // depends on when CI runs\n        using var http = new HttpClient();                    // real network\n        try { await http.PostAsJsonAsync(\"https://reports/api\", report); }\n        catch (HttpRequestException) { report.MarkFailed(); } // only on real network errors\n    }\n}\n\n// COVERABLE: time and the external API are injected\npublic class ReportSender(TimeProvider time, IReportsApi api)\n{\n    public async Task SendAsync(Report report, CancellationToken ct)\n    {\n        if (time.GetUtcNow().Hour < 6) return;\n        try { await api.Send(report, ct); }\n        catch (HttpRequestException) { report.MarkFailed(); }\n    }\n}\n```\n\nNow each line has a cheap test: `FakeTimeProvider` at 05:00 and at 07:00, and a FakeItEasy\n`.Throws(new HttpRequestException())` for the catch block.\n\nOther design habits that make coverage come naturally:\n- **Small methods with one decision each.** Fewer combinations per test.\n- **Pure functions for calculations.** Input in, value out, no setup.\n- **No error handling for impossible scenarios.** Defensive code for cases that cannot happen creates\n  lines no test can reach. Fail fast with a clear exception at the boundary instead.\n- **Keep wiring thin.** Startup and DI registration are covered by one component test; logic belongs in\n  classes that unit tests can create.\n\nSee chapter 10 (section 7, \"Mock only at seams\") for what to fake at those seams.\n\n---\n\n## 11. Talking about metrics: Goodhart's law\n\n**Goodhart's law**: *when a measure becomes a target, it stops being a good measure.* People optimize\nthe number, not the thing the number was supposed to show.\n\nCoverage is a textbook case:\n- A team with a \"90% coverage\" target writes assertion-free tests and constructor tests for DTOs.\n- A team that sees coverage as a **signal** asks \"which risky paths are not tested?\" and writes fewer,\n  better tests.\n\nHow a strong candidate talks about it:\n- **Coverage is a floor detector, not a quality score.** Low coverage tells you something is\n  untested. High coverage does not tell you the tests are good.\n- **Gate the change, not the codebase.** Diff coverage keeps new code tested without blocking on legacy.\n- **Pair it with a quality signal.** Mutation score on samples, review rules (does the regression test\n  fail without the fix?), escaped-defect trends.\n- **Never use it to rank people.** It immediately becomes a target and gets gamed.\n- **Choose the threshold from cost.** 80% on changed lines leaves room for trivial lines and\n  generated code; 100% would push people to `[ExcludeFromCodeCoverage]` or to silly tests.\n\n**Interviewer view:** \"What coverage percentage should we have?\" has no single right number. A strong\nanswer moves the question from *how much* to *what*: which risks, which code paths, which changes.\n\n---\n\n## At Smartcat (summary)\n\n- The monolith's backend MR pipeline has a **blocking** diff coverage gate:\n  `Backend/Code Coverage [Diff Line Rate Check]`, threshold `LineRate >= 0.8` on changed lines, base =\n  merge-base with `origin/develop`.\n- The result is a **Diff Coverage Status** JSON comment on the MR: `CoveredLines`, `TotalLines`,\n  `LineRate`, `UncoveredFiles[]` with `UncoveredLines`.\n- Fixing workflow (skill `backend-smartcat-backend-code-coverage`): get MR changes \u2192 read the report \u2192\n  read uncovered lines \u2192 write tests with the chapter 10 conventions \u2192 run them \u2192 push.\n- Prioritize business logic, then error handling, then integration points; deprioritize DTOs,\n  pass-throughs, generated code.\n- Run new tests with `-- --filter` under the MTP runner; check the executed count.\n- `FindMergeBase ... object not found` = shallow-clone flake: retry the job; if the same ID repeats,\n  start a fresh MR pipeline; do not keep rebasing.\n- QA skills add mutation testing (Stryker, per-file `--mutate`) and a coverage-theater flag (line \u2265 80%\n  and mutation < 60%).\n\n---\n\n## Interview corner\n\n### As the interviewee\n\n1. **What is the difference between line and branch coverage? Give an example where they differ.**\n   A strong answer covers:\n   - Line = executed lines; branch = decision outcomes taken.\n   - `if (a && b) return x;` on one line: one test makes the line green, but outcomes stay untested.\n   - Branch coverage is noisier in async/iterator code.\n\n2. **What is diff coverage and why would a team gate on it instead of total coverage?**\n   - Coverage of changed lines only.\n   - Fair to the author, does not block on legacy, works as a ratchet in the code that changes most.\n   - Total coverage moves for wrong reasons (deleting tested code lowers it).\n\n3. **How is the diff coverage number computed?**\n   - Merge-base with the target branch, changed lines from the diff, intersected with executable lines\n     in the coverage report, `covered / total`.\n   - Deleted lines and non-executable lines do not count.\n\n4. **Your MR fails the diff coverage gate at 0.62. What do you do?**\n   - Read the report, list uncovered lines per file, sort by size.\n   - Map lines to code; separate logic from trivial lines.\n   - Write tests for logic and error paths first; run with the right filter; push.\n   - Check the job log first, in case the tool crashed instead.\n\n5. **Tests pass and you added new tests, but the coverage number did not change. Why?**\n   - The tests do not reach the exact lines (another branch, an earlier return, the `throw` part of an\n     expression).\n   - The test project does not load that assembly, or the filter ran different tests.\n\n6. **Is 100% coverage a good goal?**\n   - No; Goodhart's law; tests without assertions; equivalent mutants; cost grows sharply near 100%.\n   - Use coverage to find untested risk; pair with mutation testing and review.\n\n7. **What is mutation testing, and what does a surviving mutant tell you?**\n   - Small code changes (operators, conditions, removed statements); tests should fail.\n   - Survived = tests run the code but do not check that behaviour; often a missing boundary assert.\n   - Score = killed / (killed + survived + no coverage).\n\n8. **How do you collect coverage locally for a .NET project?**\n   - coverlet (`--collect:\"XPlat Code Coverage\"`) or MTP code coverage (`--coverage\n     --coverage-output-format cobertura`).\n   - Read Cobertura XML or render with ReportGenerator.\n\n9. **When is `[ExcludeFromCodeCoverage]` acceptable?**\n   - Generated code and pure data holders.\n   - Not to hide logic; explain it in the MR.\n\n10. **The coverage job fails with `FindMergeBase ... object not found`. What is it and what do you do?**\n    - Shallow clone in CI lacks a commit the merge-base walk needs; environmental.\n    - Retry; if the same ID repeats, a fresh pipeline; do not keep rebasing; escalate the fetch depth.\n\n11. **How do you design code so it is easy to cover?**\n    - Inject time, HTTP clients and other external effects (seams).\n    - Small methods, pure calculations, no defensive code for impossible states.\n\n12. **How do you talk to a manager who wants \"90% coverage by Q3\"?**\n    - Agree on the real goal (fewer escaped bugs, safe changes).\n    - Propose diff coverage on new code plus risk-based testing of critical paths.\n    - Offer quality signals (mutation score samples, regression tests per incident).\n\n### As the interviewer\n\n**What to ask:** show a short method and one test that \"covers\" it 100% with a weak assertion. Ask:\n\"Is this method tested?\"\n\n**Depth probes:**\n- \"Which mutant would survive here?\"\n- \"Why compare with the merge-base and not with the tip of develop?\"\n- \"A refactoring MR moves 400 untested lines and fails the gate. What do you do?\"\n- \"How would you choose the threshold for a diff coverage gate?\"\n- \"What else would you measure next to coverage, and how would you stop people gaming it?\"\n\n**Green flags:**\n- Separates *executed* from *verified* without being prompted.\n- Knows branch coverage and gives a concrete one-line example.\n- Fixes a coverage gap with tests that protect behaviour, not tests that touch lines.\n- Reads the CI log before writing tests; recognizes infrastructure failures.\n- Mentions Goodhart's law or the same idea in their own words.\n\n**Red flags:**\n- \"We had 95% coverage, so the code was well tested.\"\n- Proposes `[ExcludeFromCodeCoverage]` or deleting tests to pass a gate.\n- Writes assertion-free tests \"just for the gate\".\n- Keeps rebasing to fix a CI tool crash.\n\n**Scoring rubric:**\n\n| Signal | Junior | Senior | Staff |\n|---|---|---|---|\n| Definitions | Knows line coverage | Line vs branch vs diff, with examples | Explains instrumentation, merge-base, executable lines |\n| Using the gate | Writes any test that turns lines green | Prioritizes logic and error paths | Shapes the code and the gate (threshold, exclusions) so it measures the right thing |\n| Quality | Trusts the number | Knows assertion-free tests and mutation testing | Combines coverage, mutation samples and risk maps into a test strategy |\n| CI issues | Re-pushes until green | Reads logs, retries flakes | Finds the root cause (shallow clone) and gets it fixed for everyone |\n| Metrics talk | \"More is better\" | Mentions Goodhart's law | Moves the conversation from a percentage to risk and change safety |\n\n---\n\n## Exercises\n\n1. **Read a report.** The Diff Coverage comment shows `CoveredLines: 21, TotalLines: 30, LineRate: 0.7`\n   with two files: `ScopeService.cs` (7 uncovered of 12) and `ScopeDto.cs` (2 uncovered of 2). What is\n   the minimum number of lines you must cover, and where do you start?\n\n2. **Branch vs line.** Write a method where one test gives 100% line coverage but 50% branch coverage.\n   Then write the second test.\n\n3. **Kill the mutant.** For `bool IsOverdue(DateTimeOffset deadline) => _time.GetUtcNow() > deadline;`,\n   which mutant survives if your only tests use \"one day before\" and \"one day after\"? Write the test\n   that kills it.\n\n4. **Make it coverable.** A class calls `File.ReadAllText(\"/etc/app/limits.json\")` inside a method that\n   also contains the limit logic. Redesign it so every line can be covered by unit tests.\n\n5. **CI triage.** The gate failed twice with `object not found - no match for id (e4c1...)`, the same\n   ID both times. Your colleague wants to rebase on develop again. What do you do instead, and why?\n\n6. **Metric debate.** Write three sentences you would say in a design review against a \"95% total\n   coverage\" target for the monolith, and propose an alternative.\n\n<details>\n<summary>Answer notes<\/summary>\n\n1. The gate needs `>= 0.8 \u00d7 30 = 24` covered lines, so at least **3 more**. Start with `ScopeService.cs`\n   (logic, 7 uncovered lines); tests for its branches will likely cover 3+ lines and protect behaviour.\n   The DTO lines are trivial; cover them only if they appear naturally in a service test, or exclude a\n   pure data type with an explanation.\n\n2. Example: `public int Clamp(int x) { if (x > 100) x = 100; return x; }` written with the `if` and its\n   statement on one line. A test with `x = 150` executes every line; the \"not greater than 100\" outcome\n   is never taken. Second test: `x = 50`, assert 50.\n\n3. The mutant `>` \u2192 `>=` survives: both tests give the same result for `>` and `>=`. Kill it with a test\n   where `GetUtcNow()` equals `deadline` exactly (use `FakeTimeProvider` set to the deadline) and assert\n   `IsOverdue` is `false`.\n\n4. Inject the source of the limits: an `ILimitsSource` (or `IOptions<LimitsSettings>` bound from config)\n   that the logic class receives. The logic becomes a pure method over a `Limits` object; the file\n   reading lives in a thin adapter covered by one integration test (or by the configuration system).\n   Unit tests pass `Limits` directly.\n\n5. The error is the shallow-clone merge-base flake, not a coverage problem. Same ID twice means retrying\n   the job is not helping: start a **fresh MR pipeline**. Rebasing does not help: it fails also at zero\n   divergence, and develop moves while the long pipeline runs. If it continues, ask DevOps to raise the\n   fetch depth for that job, or let a human decide to waive this one gate.\n\n6. Example: \"A total target punishes every MR for legacy code its author never touched, and it moves\n   for wrong reasons, for example when we delete tested code. Teams under a total target write tests\n   that run code without checking it, so the number goes up and the safety does not. I propose we keep\n   the 80% diff coverage gate on changed lines, add mutation-testing samples on our critical-path\n   components, and require a failing-first regression test for every production bug.\"\n\n<\/details>\n\n---\n\n## Summary\n\n- Line coverage = executed lines; branch coverage = taken decision outcomes; diff coverage = coverage of\n  the lines you changed.\n- Gate on diff coverage: new code must be tested, legacy does not block, the tested share grows where\n  code changes.\n- The number = covered changed executable lines / all changed executable lines, against the merge-base.\n- At Smartcat the monolith gate needs `LineRate >= 0.8` and posts a JSON report with uncovered lines per file.\n- Fix order: business logic, then error handling, then integration points; DTOs and pass-throughs last.\n- Under the MTP runner use `-- --filter`, and check the executed test count.\n- `FindMergeBase ... object not found` is a shallow-clone flake: retry the job, then a fresh pipeline;\n  do not keep rebasing.\n- Coverage shows execution, not verification; mutation testing shows if tests really check behaviour.\n- Hard-to-cover code is a design signal: add seams for time, I/O and external services.\n- Goodhart's law: a coverage target gets gamed; use coverage as a signal to find untested risk.\n\nAnki deck: anki/11-diff-coverage.txt\n"}, {"id": "12-code-review", "title": "12. Code review from both sides of the MR", "md": "# 12. Code review from both sides of the MR\n\n## Why this chapter matters\n\nMany .NET interviews now have a \"code review exercise\": you get a diff or a class, and 20\u201330\nminutes to review it aloud. It tests more than knowledge. It tests priorities (do you find the\ndata-loss bug before the naming issue?), communication (can you say what is wrong without\nsounding hostile?) and judgment (is this a blocker or a nit?). In real work, review is where most\nknowledge moves between engineers. Reviewers protect production; authors learn the codebase. Both\nsides have skills, and both sides can be practiced.\n\n## What you will be able to do\n\n- Review a .NET diff in a fixed order: correctness, then design, then tests, then style.\n- Assign BLOCKER / MAJOR / MINOR / NIT and defend the level with a failure scenario.\n- Apply the Smartcat backend checklist (style, tests, tasks, events, migrations) and the\n  architecture rules (A-series) by theme.\n- Write short, clear review comments that explain why and propose a fix.\n- Receive review well: verify each point against the code, answer with evidence, keep MRs small.\n- Run and pass a code review interview exercise.\n\n---\n\n## 1. What a good review looks for, in order\n\nReviewers have limited attention. Spend it where the risk is. The order:\n\n```mermaid\nflowchart LR\n    A[1. Correctness<br>data loss, races,<br>tenant leaks] --> B[2. Design<br>boundaries, DI,<br>atomicity, invariants]\n    B --> C[3. Tests<br>does a test fail<br>without the fix?]\n    C --> D[4. Style<br>naming, magic numbers,<br>comments]\n```\n\n| Step | Questions | Example findings |\n|---|---|---|\n| 1. Correctness | Does it do what the ticket says? What happens on retry, on concurrency, on missing data, on another tenant? | lost events, task never completes, `Single()` on duplicates, missing `accountId` filter |\n| 2. Design | Is it in the right layer? Lifetimes correct? One atomic operation? Invariant inside the aggregate? | singleton with scoped dependency, N+1, multi-doc update without atomicity |\n| 3. Tests | Is the new behavior tested? Does a test fail when the fix is reverted? Are edge cases (null, missing, zero) covered? | new handler without test, bug fix without regression test |\n| 4. Style | Does it follow repo conventions? | camelCase private method, magic number, stale TODO |\n\n**Why this order?** Style findings are cheap to find and cheap to fix. If you start with style,\nyou fill your attention and the comment thread with 20 nits, and the one data-loss bug hides\nbetween them. The author also fixes the easy nits first and feels \"done\".\n\nTip: before reading the diff, read the ticket and the MR description. You cannot judge\ncorrectness without knowing the intent. The Smartcat review bot does the same: it extracts the\n`SUPPORT-12345`-style ID from the title and loads the ticket first.\n\nSecond tip: **do not review the diff in isolation.** Open the full file and the callers. A diff\nshows what changed. It does not show the caller that now gets `null`, or the second\nimplementation of the interface that was not updated.\n\nCommon mistake: \"LGTM\" after reading only the green lines. Removed lines matter too. A removed\n`if` or a removed `await` is often the bug.\n\n---\n\n## 2. Severity levels and how to calibrate them\n\n### 2.1 The four levels\n\n| Level | Meaning | Merge? | Typical examples |\n|---|---|---|---|\n| **BLOCKER** | will break production, lose data, leak data, or break the contract | no | DI lifetime mixing (A1), pre-release NuGet (D11), MR claims a change the diff lacks (D27), new handler without any test (T1), workflow trigger without idempotency key (A34) |\n| **MAJOR** | real bug or design risk under realistic conditions | not without a fix or an agreed follow-up | N+1 on a hot path (A20), multi-doc update without atomicity (A22), exception as success (D8), dead code (D2), missing regression test (T11) |\n| **MINOR** | quality issue; costs maintenance, not correctness | author decides; usually fixed | magic numbers (D1), raw `IConfiguration` (D5), naming drift (D17) |\n| **NIT** | taste or polish | optional | tab indentation (D12), `Async` suffix (D15), `Where().Any()` (D9) |\n\nThe general Smartcat review bot uses a three-level report: **Critical** (must fix), **Warning**\n(should fix), **Suggestion**. It maps roughly to BLOCKER+MAJOR / MINOR / NIT. Status logic: any\nCritical means \"NEEDS CHANGES\"; only warnings and suggestions mean \"APPROVED with notes\".\n\n### 2.2 Calibration: three questions\n\nFor every finding, answer:\n\n1. **What is the failure scenario?** Say it in one sentence: \"When two pods process the same\n   event, the counter is incremented twice.\" If you cannot say it, the finding is probably a NIT.\n2. **How likely is it?** Every request, under load only, on a rare data shape, never in practice?\n3. **How bad and how reversible?** Lost data and cross-tenant leaks are not reversible. A slow\n   page is. A wrong log message is trivial.\n\n| Impact \\ Likelihood | Every request | Under load / retries | Rare data shape |\n|---|---|---|---|\n| Data loss, leak, security | BLOCKER | BLOCKER | MAJOR or BLOCKER |\n| Wrong result, stuck task | BLOCKER | MAJOR | MAJOR |\n| Performance | MAJOR | MAJOR | MINOR |\n| Readability | MINOR | MINOR | NIT |\n\n**Rules for calibration:**\n\n- **Do not inflate.** If everything is a BLOCKER, nothing is. Authors learn to ignore you.\n- **Do not deflate to be nice.** A cross-tenant query is a BLOCKER even if the MR is for a\n  \"small fix\".\n- **Context changes the level.** Rule D1 (magic number) is MINOR. A38 (magic TTL for a\n  distributed lock) is also MINOR, but if the TTL is shorter than the operation, it is a correctness\n  bug and becomes MAJOR. Severity follows the consequence, not the rule number.\n- **Existing patterns lower the level.** If the whole module does it the same way, a deviation in\n  this MR is at most MINOR, and fixing the module is a separate ticket.\n- **Some rules escalate.** Example from the team's test rules: a test that reads private members\n  by reflection is MINOR by default, but MAJOR when the test project already has\n  `InternalsVisibleTo`, because the clean fix was a one-word change.\n\n### 2.3 Say the level in the comment\n\n```text\nMAJOR: this loop awaits one Mongo read per scope. On a project with 5k documents that is 5k\nround trips. Load all scopes with one FindByIds and zip them back.\n\nNIT (optional): Where(...).Any() can be Any(...).\n```\n\nWhy: the author needs to know what blocks the merge. \"Optional\" on NITs removes stress and saves\na review round.\n\n---\n\n## 3. The Smartcat backend checklist\n\nThis is the checklist from the team's backend review skill. Use it as a final pass after the\ncorrectness reading.\n\n### 3.1 Style (details in chapter 02 (Code style and naming))\n\n- Private methods `camelCase` (monolith, PTS); private fields `_camelCase`.\n- Meaningful lambda names when the parameter is used.\n- Mongo models: `required` + `init`, explicit `[BsonElement(\"camelCase\")]`, enums as strings.\n- Separate DB entity, API request, API response.\n- New indexes `IDX_` / `UDX_`; keep existing `IX_` names.\n- No magic numbers; `#nullable enable` in new monolith files; no dot at end of comments; local\n  functions only when they simplify a lot.\n\n### 3.2 Unit tests (details in chapter 10 (Unit and integration testing))\n\n- Name: `Should_do_something_when_condition` (`Should_throw_when_name_is_empty`).\n- AAA: `// Arrange`, `// Act`, `// Assert` with blank lines; one Act; no shared mutable state.\n- Base classes: `BaseTest` (mocks, no DB), `BaseEphemeralMongoTest` (fast in-memory DB),\n  `BaseMongoTest` (Docker integration).\n- Prefer asserting state over call counts (T5). Do not mock the class under test's new\n  collaborators introduced in the same MR (T6). Inject time and Guid sources (T8).\n- No reflection into non-public members (`GetField(..., BindingFlags.NonPublic)`,\n  `[UnsafeAccessor]`). Test through the public API, or extract the hidden dependency.\n\n### 3.3 Task processing (details in chapter 08 (Background task processing))\n\n```text\nSleep -> InProgress -> Closed / Manual\n            ^\n     RecaptureTimeout\n```\n\n| Check | Why it matters |\n|---|---|\n| Every path ends with `Completed.Now()` / `Completed.After(delay)` | otherwise the task hangs forever (a Critical finding) |\n| Retries use `Rescheduled(reason)` / `TaskRetryPolicy` | transient errors must not close the task |\n| Manual state through an exception | a human must look; do not silently loop |\n| `OrdinaryTask` / `SingletonTask` (with `SingletonLock`) / `StickyTask` (consistent `StickyKey`) | wrong type = duplicates or no progress |\n| `FairnessHash` set when one tenant can flood the queue | otherwise one big customer starves everyone else |\n| `TierKey` for gradual (canary) rollout | lets a risky change reach some tenants first |\n| Long operations: batching, timeout protection, state persisted | a crash mid-way must resume, not restart from zero |\n| Partial failures stored in task state | never \"complete\" silently with half the work done |\n\n### 3.4 Domain events and Kafka (details in chapter 07 (Domain events, the Outbox pattern and Kafka))\n\n```csharp\n// CRITICAL: append events, never overwrite them\nawait _outbox.PushEach(projectId, events);\n```\n\n| Check | Why |\n|---|---|\n| `PushEach`, never `Set` for outbox events | `Set` overwrites events that are not yet published: lost messages |\n| Batch limits on idempotency keys per message | one huge message can exceed limits |\n| `EventWithIdempotencyKeyBase` for idempotent handlers | Kafka delivers at least once; duplicates are normal |\n| `[MqEvent(typeof(X), ConsumerSet = \"my-handler\")]` matches the handler purpose | consumer sets define offsets; a copy-pasted name shares offsets with another handler |\n| DLQ strategy for failures | a poison message must not block the partition forever |\n\n### 3.5 Migrations (details in chapter 09 (MongoDB models, indexes and safe migrations))\n\n| Phase | What belongs there |\n|---|---|\n| **Before release** | add nullable fields, new indexes, new collections |\n| **After release** | remove deprecated fields, drop old indexes, cleanup |\n\n- Index creation: `SafeCreateIndex` in a repository (throws if the collection is not empty, so it is\n  for new collections), `EnsureIndexAsync` in migrations (idempotent).\n- Two-phase deployment for breaking changes: phase 1 adds the nullable field and dual read/write;\n  phase 2 migrates data, requires the field, removes the old one.\n- Backward compatible (old code works with new schema) **and** forward compatible (new code works\n  with old data). During a rolling deploy both versions run at the same time.\n\n### 3.6 General checks from real MR history\n\nThe backend reviewer's rule table is mined from real MRs. The high-value ones:\n\n| Check | Level | Why |\n|---|---|---|\n| `Single()` on a collection that can have duplicates | Critical | throws in production on the first duplicate |\n| Auth must consider all roles, including freelancers/external users | Critical | unauthorized access |\n| Tenant/account id in every Mongo filter | Critical | cross-tenant leak **and** a full scan without the index |\n| Upsert without `DuplicateKeyException` handling | Critical | two concurrent upserts race; one fails |\n| Release a preliminary version before adding new fields | Warning | rollback to old code must still read new documents |\n| Business logic in controllers | Warning | hard to test and reuse |\n| Cache key includes all request parameters | Warning | stale or wrong data for other parameters |\n| Cache operations wrapped with fallback | Warning | a cache failure must not fail the request |\n| Caught exceptions logged with context | Warning | silent swallow = invisible incident |\n| Batch reads, DB projections, `HashSet` lookups | Warning/Suggestion | performance at scale |\n| PATCH/PUT for updates; keep old endpoints until deprecated | Warning | contract hygiene and backward compatibility |\n| Remove TODOs before merge | Warning | debt never paid |\n\n---\n\n## 4. Architecture rules by theme (A-series)\n\nThe A-series (A1\u2013A39) comes from the review skill for the AI agents service, but most rules apply to\nevery Smartcat .NET service. Learn them by theme, not by number.\n\n### 4.1 DI lifetimes and composition\n\n| Rule | Pattern | Level |\n|---|---|---|\n| A1 | same interface registered with two lifetimes; singleton with a scoped dependency; `IHttpContextAccessor` in a singleton used by background workers | BLOCKER |\n| A2 | behavior depends on the implicit order of `services.AddX()` or `IHostedService.StartAsync` | MAJOR |\n| A6 | `AddHttpClient<TClient>` with config inline in the consumer instead of an `AddXClient()` extension in the client library | MAJOR |\n| A16 | `IServiceProvider` injected into a non-factory class (service locator) | MAJOR |\n| A17 | a new hand-written `*Client` where a generated SDK exists | MAJOR |\n| A19 | registry depends on policy and policy on registry (cycle) | MAJOR |\n\n```csharp\n// BAD (A1): captive dependency. The scoped DbContext-like object lives forever\nservices.AddScoped<IUnitOfWork, MongoUnitOfWork>();\nservices.AddSingleton<IReportService, ReportService>(); // ReportService(IUnitOfWork uow)\n\n// GOOD: match lifetimes, or create a scope per operation\npublic sealed class ReportService(IServiceScopeFactory scopeFactory) : IReportService\n{\n\tpublic async Task Build(Guid reportId, CancellationToken ct)\n\t{\n\t\tawait using var scope = scopeFactory.CreateAsyncScope();\n\t\tvar uow = scope.ServiceProvider.GetRequiredService<IUnitOfWork>();\n\t\t// ...\n\t}\n}\n```\n\nWhy BLOCKER: it compiles, it passes unit tests, and it fails under load (shared state between\nrequests, disposed objects). `ValidateScopes` in Development catches some cases; background\nworkers often escape it. See chapter 05 (ASP.NET Core).\n\nA2 question to ask in review: **\"What guarantees this order?\"** If the answer is \"the line order in\n`Module.cs`\", it will break the day someone sorts the lines.\n\n### 4.2 Cross-pod state and background runs\n\nSmartcat services run several pods. Anything stored in one pod's memory is invisible to the others\nand lost on restart.\n\n| Rule | Pattern | Level |\n|---|---|---|\n| A3 | lambdas, `Func<>` instances or anonymous types used as identity (node IDs, keys) | MAJOR |\n| A18 | per-pod `IMemoryCache` in checkpointed or cross-pod flows | MAJOR |\n| A23 | singleton repository with hidden per-request state (`AsyncLocal`, `HttpContext` in a field) | MAJOR |\n| A4 | background handlers keyed only by `runId`, without `(workspaceId, conversationId)` | MAJOR |\n| A9 | `HttpContext` state (feature flags, culture) snapshotted into a background run record | MAJOR |\n| A7 | one handler for both \"user cancelled\" and \"worker lost\" | MAJOR |\n| A11 | lock renewer treats every exception as \"lock lost\" | MAJOR |\n\nWhy A9 matters: the run may execute hours later, on another pod. The flag may have changed.\nStore identity (`accountId`, `workspaceId`) and re-resolve flags in the background context.\n\nWhy A11 matters: a network glitch during renewal is not the same as another pod taking the lock.\nTreating both the same either kills healthy runs (too strict) or lets two pods work at once.\nClassify: logical lock-lost = stop; infrastructure error = retry with backoff. See chapter 04\n(Multithreading, concurrency and distributed locks).\n\n### 4.3 MongoDB: atomicity, N+1, scans, 16 MB, indexes\n\n| Rule | Pattern | Level |\n|---|---|---|\n| A20 | `foreach (...) await repo.Get(id)` on a hot path (N+1) | MAJOR |\n| A21 | `Find(Filter.Empty)` without paging; unbounded `GetAll()`; in-memory `GroupBy` | MAJOR |\n| A22 | several `UpdateOne`/`DeleteOne` calls that together form one atomic intent | MAJOR |\n| A29 | one document that grows without limit (`$push` to a per-tenant array) toward 16 MB | MAJOR |\n| A10 | new field filtered with `Eq` without handling \"missing\" in old documents | MINOR |\n| A24 | the same index created in warmup `SafeCreateIndex` and in a migration without a clear owner | MINOR |\n| A25 | a new index only in a migration, with no `SafeCreateIndex` entry: fresh environments miss it | MAJOR |\n| A26 | new unique index on a nullable field that is backfilled later, without a partial filter | MINOR |\n| A27 | unique index on `Name`/`Key`/`Slug` without the tenant co-key | MINOR |\n| A28 | `if (await Exists(x)) throw; await Insert(x);` (TOCTOU) on a path with a unique index | MINOR |\n\n```csharp\n// BAD (A20): N+1\nforeach (var task in tasks)\n{\n\tvar scope = await _scopes.Get(task.ScopeId, ct);\n\tresult.Add(Map(task, scope));\n}\n\n// GOOD: one query, zip in memory\nvar scopeIds = tasks.Select(task => task.ScopeId).Distinct().ToArray();\nvar scopes = (await _scopes.GetByIds(scopeIds, ct)).ToDictionary(scope => scope.Id);\nvar result = tasks.Select(task => Map(task, scopes[task.ScopeId])).ToList();\n```\n\n```csharp\n// BAD (A28): check-then-insert race; two requests both pass the check\nif (await _templates.ExistsByName(accountId, name, ct))\n\tthrow new DuplicateTemplateException(name);\nawait _templates.Insert(template, ct);\n\n// GOOD: let the unique index (UDX_AccountId_Name) decide, map the error\ntry\n{\n\tawait _templates.Insert(template, ct);\n}\ncatch (MongoWriteException ex) when (ex.WriteError.Category == ServerErrorCategory.DuplicateKey)\n{\n\tthrow new DuplicateTemplateException(name);\n}\n```\n\nWhy A22: if the process dies between update 3 and update 4, the data is half-changed and no code\nknows how to repair it. Use `UpdateManyAsync` with array filters, a single-document design, or a\ntransaction (`IClientSessionHandle`) when the intent spans documents.\n\nWhy A29: MongoDB has a hard 16 MB document limit. Long before the limit, big documents are slow to\nread, write and replicate. Per-entry rows scale; one growing document does not.\n\nA10 / T4 detail: \"null\", \"missing\" and \"zero\" are three states in MongoDB. `Filter.Eq(x =>\nx.Version, 0)` does not match documents where `version` does not exist. Use\n`Or(Eq(Version, current), Exists(false))` or backfill.\n\n### 4.4 Invariants, domain design and service shape\n\n| Rule | Pattern | Level |\n|---|---|---|\n| A31 | invariant checked only by callers (`if (x.Status == Active)` in 2+ places) | MAJOR |\n| A5 | partial class files > 50 lines each; class with > 5 public + > 10 private methods | MINOR |\n| A13 / A15 | a tool/endpoint method with I/O inline or > 60 lines of orchestration | MAJOR |\n| A14 | the same \"build payload, call, parse\" in 3+ classes | MAJOR |\n| A12 | a stream adapter (SSE proxy) that also does side effects | MAJOR |\n| A8 | status as empty classes instead of an enum | MINOR |\n\n```csharp\n// BAD (A31): every caller must remember the rule\nif (scope.Status == ScopeStatus.Active)\n\tscope.Complete(now);\n\n// GOOD: the aggregate protects itself\npublic void Complete(DateTime now)\n{\n\tif (Status != ScopeStatus.Active)\n\t\tthrow new InvariantViolationException($\"Scope {Id} is {Status}, cannot complete\");\n\tStatus = ScopeStatus.Completed;\n\tCompletedAt = now;\n}\n```\n\nWhy: the third caller, written a year later, will forget the check. An invariant that lives in\nthe object cannot be forgotten.\n\n### 4.5 Idempotency and replay\n\n| Rule | Pattern | Level |\n|---|---|---|\n| A34 | a workflow started from a UI confirmation without an idempotency key | BLOCKER |\n| A35 | a re-entry or rejection path that does not carry the prior decision | MAJOR |\n| T14 | a fix to state-update or queueing logic without a \"process the same input twice\" test | MAJOR |\n| T17 | a new retry loop without a test that it gives up after N attempts | MAJOR |\n\nWhy A34 is a BLOCKER: users double-click; browsers retry; gateways retry. Without a key derived\nfrom the confirmation ID, one click can start two workflows that both send emails or spend money.\n\n### 4.6 Failure handling and circuit breakers\n\n| Rule | Pattern | Level |\n|---|---|---|\n| A30 | a circuit breaker that counts all exceptions, including user-input errors | MAJOR |\n| A7 | cancellation reason not distinguished | MAJOR |\n| A39 | a TTL field without a written contract (writer, cleaner, staleness, crash) | MAJOR |\n| A38 | TTL/lease durations as inline numbers | MINOR |\n\n```csharp\n// BAD (A30): one bad file from one customer opens the breaker for everyone\ncatch (Exception)\n{\n\tif (++_consecutiveFailures > _threshold)\n\t\t_breaker.Open();\n\tthrow;\n}\n\n// GOOD: only infrastructure failures count\ncatch (Exception ex) when (isInfrastructureFailure(ex))\n{\n\tif (++_consecutiveFailures > _threshold)\n\t\t_breaker.Open();\n\tthrow;\n}\n```\n\nThe comment on the rule calls this \"DoS-self\": a single user can deny service to all users by\nuploading broken input repeatedly.\n\n### 4.7 AI-agent-specific rules (know they exist)\n\nA32/A33 (normalize system/developer roles in loaded chat history, in one extension method), A36\n(make \"null\" explicit in LLM payloads instead of omitting it), A37 (tool names as constants). They\nmatter for the AI services; in an interview for a general .NET role, knowing the principle\n(\"centralize one normalization step\", \"make absence explicit\") is enough.\n\n---\n\n## 5. How to write review comments\n\n### 5.1 The shape\n\nA good comment has three parts and fits in **1\u20132 lines**:\n\n1. **Level** (BLOCKER / MAJOR / MINOR / NIT).\n2. **What and why**: the failure scenario, not the rule name only.\n3. **Proposed fix**: concrete, ideally code.\n\n```text\nBAD:  This is wrong.\nBAD:  Why did you do it like this??\nBAD:  Rule A22.\nGOOD: MAJOR: if the pod dies after the 2nd UpdateOne, the stages stay half-moved.\n      One UpdateMany with an array filter keeps it atomic.\n```\n\n### 5.2 Language rules (written for a team of non-native English readers)\n\nAt Smartcat most engineers read English as a second language. Comments must be easy to read for\nthem:\n\n- Short sentences, one idea each, active voice.\n- No idioms, phrasal verbs or slang: \"this fails\", not \"this blows up\"; \"remove\", not \"get rid of\".\n- Plain words: \"use\", not \"leverage\"; \"check\", not \"sanity-check\".\n- Keep technical terms (N+1, idempotent, DI). Explain any other term once.\n- Respect the line width of the repo (120 in the monolith) for code comments in the diff.\n\n### 5.3 Tone\n\n- **Talk about the code, not the person.** \"This loop issues one query per item\", not \"you\n  wrote an N+1\".\n- **Ask when you are not sure.** \"Can `scopes` contain the same id twice? If yes, `Single()` throws.\"\n  A question is not weaker; it is honest.\n- **Say what is good.** The review bot report has a \"Positive observations\" section for a reason:\n  it tells the author which patterns to keep.\n- **One comment per issue.** If the same issue appears 12 times, comment once: \"Same in 11 other\n  places in this file.\"\n\n### 5.4 What not to comment\n\nFrom the team's review agent rules:\n\n- Do not nitpick formatting that the linter handles.\n- Do not review commented-out code; ask to delete it.\n- Do not suggest unrelated refactoring in this MR. Open a ticket.\n- Do not post unverified examples. Re-check that your \"current\" and \"should be\" are actually\n  different, and that hardcoded strings you quote exist in the source.\n\n### 5.5 Code comments added in the MR\n\nCode comments in the diff follow the same idea: 1\u20132 lines, the *why*, not the mechanics. Production\nlogic has no inline comments unless one is truly needed (see chapter 02). Longer reasoning goes to\nthe MR description.\n\n---\n\n## 6. How to receive review\n\n### 6.1 Verify each point against the code\n\nA reviewer can be wrong. You can be wrong. Feelings decide neither. For each comment:\n\n1. **Read the code again** at the commented line, and the callers.\n2. **Reproduce if you can**: write the test the reviewer implies. If it fails, the point is valid.\n3. **Decide**: agree and fix, agree and defer (with a ticket), or disagree with evidence.\n4. **Reply with the result**, short: \"Fixed in a1b2c3d: added the `accountId` filter and a test.\"\n   or \"Checked: `scopes` comes from a unique index `UDX_TaskId`, so duplicates are impossible.\n   Keeping `Single()`.\"\n\nA useful habit: make a small table for yourself before answering.\n\n| # | Point | Valid? | Evidence | Action |\n|---|---|---|---|---|\n| 1 | N+1 in `BuildReport` | yes | 1 query per scope, seen in test log | batch read |\n| 2 | rename `Get` to `GetAsync` | no | repo convention: no suffix (0 of 230 methods) | reply with evidence |\n| 3 | missing test for retry limit | yes | none found | add test (T17) |\n\n### 6.2 Do not argue by feeling\n\n- \"I think it is fine\" is not an answer. \"It is fine because X, and here is the test\" is.\n- If you disagree on taste, follow the repo convention and move on. Taste debates belong in a team\n  meeting, once, not in every MR.\n- Do not resolve the reviewer's thread yourself. Reply and let the author of the thread resolve it.\n  This keeps the reviewer in control of \"is my concern addressed?\".\n\n### 6.3 Make your MR easy to review\n\n| Habit | Why |\n|---|---|\n| **Small and focused**: one ticket per MR (D25) | small MRs get real review; big ones get \"LGTM\" |\n| **Rebased on the target** (D28) | stale bases show fake removals and waste review time |\n| **Honest title and description** (D27) | \"bump X to Y\" must be in the diff |\n| **No dead code** (D2) | reviewers must not guess what is alive |\n| **Self-review first** | read your own diff in the GitLab UI before you assign anyone |\n| **CI green before review** | reviewers should not do the compiler's job |\n\n### 6.4 A good MR description\n\n```markdown\n## Problem\nScopes stay \"In progress\" after the last document is completed (SUPPORT-12345).\n\n## Root cause\nThe completion handler reads the scope before the last progress event is applied.\n\n## Fix\nRe-read the scope inside the handler and complete it in one conditional UpdateOne.\n\n## How it was verified\n- New test Should_complete_scope_when_last_document_completes (fails without the fix).\n- Local repro on the PTS stack: red before, green after.\n\n## Risk and rollout\nNo schema change. Safe to roll back. Automation contract: none.\n```\n\nWhy: the reviewer starts with the intent and the evidence. The description is also the\npermanent record of *why* the code changed. Inline comments are not the place for that.\n\n---\n\n## 7. Code review exercise interviews\n\n### 7.1 How to pass one (as the candidate)\n\n1. **Ask for context first** (1 minute): what does this code do, what is the load, is it a hot path,\n   single or multi-tenant, how many pods?\n2. **Read once fully, without commenting.** Build a picture.\n3. **Say your order aloud**: \"First correctness, then design, then tests, then style.\"\n4. **Report the top risks first**, each with a failure scenario and a fix.\n5. **Label severity.** Show calibration: \"This one I would block. This one is a NIT.\"\n6. **Mention what is missing**: tests, logging, idempotency, a migration.\n7. **Mention what is good.** It shows balance.\n8. **Watch the time.** At the end, summarize: \"Two blockers, one major, three nits. I would request\n   changes.\"\n\nCommon mistake: starting with \"I would rename this variable\". The interviewer hears \"this person\ndoes not see risk\".\n\n### 7.2 How to run one (as the interviewer)\n\n- **Prepare a snippet with planted issues** of different levels: one data-loss or race, one design\n  issue, one missing test, two or
